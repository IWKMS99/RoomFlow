version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: roomflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - roomflow-pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: roomflow-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:${SERVER_PORT}"
    env_file:
      - ./.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  roomflow-pg-data:
