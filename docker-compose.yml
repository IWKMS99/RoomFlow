version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: roomflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - roomflow-pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    container_name: roomflow-app
    build: .
    ports:
      - "8081:${SERVER_PORT}"
    env_file:
      - ./.env
    depends_on:
      - db
    restart: on-failure

volumes:
  roomflow-pg-data: